<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Visualizaciones - Historial</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 20px; }
        h1 { color: #00ffcc; text-align: center; }
        .btn-refresh { background-color: #00ffcc; color: #000; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; display: block; margin: 0 auto 20px auto; }
        .tabla-pedidos { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        .tabla-pedidos th, .tabla-pedidos td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .tabla-pedidos th { background-color: #252525; color: #00ffcc; }
        .estado-pendiente { background-color: #ff9800; color: #000; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
        .estado-aprobado { background-color: #4caf50; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Panel de Visualizaciones - Historial de Interacciones</h1>
    <button class="btn-refresh" onclick="cargarPedidos()">🔄 Actualizar Registros</button>

    <table class="tabla-pedidos">
        <thead>
            <tr>
                <th>Fecha / Hora</th>
                <th>Productos Elegidos</th>
                <th>Titular</th>
                <th>Número WSP</th>
                <th>Monto Total</th>
                <th>Verificación MP</th>
                <th>Estado del Pedido</th>
            </tr>
        </thead>
        <tbody id="lista-pedidos">
            <tr><td colspan="7" style="text-align:center;">Cargando historial desde Google Sheets...</td></tr>
        </tbody>
    </table>

    <script>
        // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
        const URL_API_GOOGLE = 'https://script.google.com/macros/s/AKfycbzgTijrLA833GTkSJ90Qecc9wa4IisGoOFVja36OY4S-JVwN10ieGdRe__7PH_749cU/exechttps://script.google.com/macros/s/AKfycbz8Te_iDAr2Y-3WsxXTYvp7rf6OItvjEo8XG5Ak67https://script.google.com/macros/s/AKfycbz8Te_iDAr2Y-3WsxXTYvp7rf6OItvjEo8XG5Ak67AgYcpFruu-P539t4yg7Hm3GcpK/execAgYcpFruu-P539t4yg7Hm3GcpK/exec';

        function cargarPedidos() {
            fetch(URL_API_GOOGLE)
                .then(res => res.json())
                .then(pedidos => {
                    const contenedor = document.getElementById('lista-pedidos');
                    contenedor.innerHTML = '';

                    if (!pedidos || pedidos.length === 0) {
                        contenedor.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay interacciones registradas aún.</td></tr>';
                        return;
                    }

                    pedidos.slice().reverse().forEach(p => {
                        let badgeMP = p.verificacionMP === 'Aprobado' 
                            ? '<span class="estado-aprobado">Aprobado</span>' 
                            : '<span class="estado-pendiente">Pendiente</span>';

                        let badgeEstado = p.estado === 'Aprobado' 
                            ? '<span class="estado-aprobado">Aprobado</span>' 
                            : '<span class="estado-pendiente">Pendiente</span>';

                        contenedor.innerHTML += `
                            <tr>
                                <td>${p.fecha || ''} ${p.hora || ''}</td>
                                <td>${p.productos || '-'}</td>
                                <td><strong>${p.titular || '-'}</strong></td>
                                <td>${p.whatsapp || '-'}</td>
                                <td><strong style="color: #00ffcc;">$${Number(p.montoTotal).toFixed(2)}</strong></td>
                                <td>${badgeMP}</td>
                                <td>${badgeEstado}</td>
                            </tr>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Error al cargar pedidos:", err);
                    document.getElementById('lista-pedidos').innerHTML = '<tr><td colspan="7" style="text-align:center; color: #e74c3c;">Error al conectar con Google Sheets.</td></tr>';
                });
        }

        document.addEventListener('DOMContentLoaded', cargarPedidos);
    </script>
</body>
</html>
