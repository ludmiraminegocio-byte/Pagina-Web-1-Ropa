<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Visualizaciones - Lux Indument</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
        }

        h1 {
            text-align: center;
            color: #00ffcc;
            margin-bottom: 20px;
        }

        .btn-contenedor {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-actualizar {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-actualizar:hover {
            background-color: #00cca3;
        }

        .tabla-contenedor {
            overflow-x: auto;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            color: #00ffcc;
            padding: 12px 10px;
            border-bottom: 2px solid #333;
            font-size: 14px;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #262626;
            font-size: 13px;
            vertical-align: top;
        }

        .col-productos {
            white-space: pre-line;
            line-height: 1.4;
        }

        .monto {
            color: #00ffcc;
            font-weight: bold;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }

        .badge-Pendiente {
            background-color: #ff9900;
            color: #000;
        }

        .badge-Aprobado {
            background-color: #00ffcc;
            color: #000;
        }

        .btn-verificar {
            background-color: #333;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 5px;
        }

        .btn-verificar:hover {
            background-color: #00ffcc;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>Panel de Visualizaciones - Historial de Interacciones</h1>

    <div class="btn-contenedor">
        <button class="btn-actualizar" onclick="cargarPedidos()">🔄 Actualizar Registros</button>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Productos Elegidos</th>
                    <th>Titular</th>
                    <th>Número WSP</th>
                    <th>Monto Total</th>
                    <th>Verificación MP</th>
                    <th>Estado del Pedido</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                <tr>
                    <td colspan="8" style="text-align: center;">Cargando registros...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const URL_API_GOOGLE = 'https://script.google.com/macros/s/AKfycbworMHPk02ifcC3TRvDyMcyxImD74HWwdGqG-fd_Yab_n54Im7yqgAGUXpfqMHT12hS/exec';

        function formatearFecha(val) {
            if (!val) return "-";
            const fechaObj = new Date(val);
            if (!isNaN(fechaObj.getTime())) {
                const dia = String(fechaObj.getDate()).padStart(2, '0');
                const mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
                const ano = fechaObj.getFullYear();
                return `${dia}-${mes}-${ano}`;
            }
            if (typeof val === 'string' && val.includes("T")) {
                const partes = val.split("T")[0].split("-");
                if (partes.length === 3) return `${partes[2]}-${partes[1]}-${partes[0]}`;
            }
            return val;
        }

        function formatearHora(val) {
            if (!val) return "-";
            const fechaObj = new Date(val);
            if (!isNaN(fechaObj.getTime())) {
                const horas = String(fechaObj.getHours()).padStart(2, '0');
                const minutos = String(fechaObj.getMinutes()).padStart(2, '0');
                return `${horas}:${minutos}`;
            }
            if (typeof val === 'string' && val.includes("T")) {
                const horaPartes = val.split("T")[1].split(":");
                if (horaPartes.length >= 2) return `${horaPartes[0].padStart(2, '0')}:${horaPartes[1].padStart(2, '0')}`;
            }
            return val;
        }

        function formatearProductosVertical(val) {
            if (!val) return "-";
            return String(val)
                .split(/,\s*/)
                .join("\n");
        }

        function cargarPedidos() {
            const tbody = document.getElementById("tabla-body");
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Cargando registros...</td></tr>';

            fetch(URL_API_GOOGLE)
                .then(res => res.json())
                .then(pedidos => {
                    if (!Array.isArray(pedidos) || pedidos.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">No hay pedidos registrados.</td></tr>';
                        return;
                    }

                    pedidos.reverse();

                    tbody.innerHTML = "";
                    pedidos.forEach(ped => {
                        const fechaLimpia = formatearFecha(ped.fecha);
                        const horaLimpia = formatearHora(ped.hora);
                        const productosVerticales = formatearProductosVertical(ped.productos);
                        const montoNum = parseFloat(ped.montoTotal);

                        // Agrega el botón de re-verificar si el estado es Pendiente
                        let celdaEstado = `<span class="badge badge-${ped.estado}">${ped.estado}</span>`;
                        if (ped.estado === "Pendiente") {
                            celdaEstado += ` <button class="btn-verificar" onclick="reVerificarPedido(${montoNum}, '${ped.titular}', this)">🔍 Re-verificar</button>`;
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td>${fechaLimpia}</td>
                                <td>${horaLimpia} hs</td>
                                <td class="col-productos">${productosVerticales}</td>
                                <td><strong>${ped.titular}</strong></td>
                                <td>${ped.whatsapp}</td>
                                <td class="monto">$${montoNum.toFixed(2)}</td>
                                <td><span class="badge badge-${ped.verificacionMP}">${ped.verificacionMP}</span></td>
                                <td>${celdaEstado}</td>
                            </tr>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Error al obtener pedidos:", err);
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: #ff4444;">Error al cargar los datos.</td></tr>';
                });
        }

        function reVerificarPedido(monto, titular, boton) {
            boton.innerText = "Buscando...";
            boton.disabled = true;

            fetch(URL_API_GOOGLE, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    accion: "aprobar_pago",
                    montoExacto: monto,
                    titular: titular
                })
            })
            .then(res => res.json())
            .then(res => {
                if (res.exito) {
                    alert("¡Pago aprobado con éxito!");
                    cargarPedidos();
                } else {
                    alert("Aún no se detectó la transferencia por el monto exacto en Mercado Pago.");
                    boton.innerText = "🔍 Re-verificar";
                    boton.disabled = false;
                }
            })
            .catch(err => {
                console.error("Error re-verificando:", err);
                alert("Error al conectar con el servidor.");
                boton.innerText = "🔍 Re-verificar";
                boton.disabled = false;
            });
        }

        document.addEventListener("DOMContentLoaded", cargarPedidos);
    </script>
</body>
</html>
