<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- 1. EL META VIEWPORT: Fundamental para que se vea bien en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda de Ropa - Lux Indument</title>
    
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .formulario-pago {
            background-color: #111;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            max-width: 400px;
            border: 1px solid #333;
        }
        .formulario-pago label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .formulario-pago input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #444;
        }
        #input-monto {
            background-color: #222;
            color: #00ffcc; /* Color celeste/verde agua brillante */
            font-weight: bold;
            cursor: not-allowed;
        }
        /* NUEVO: Estilo para la cajita de los datos bancarios */
        .datos-bancarios {
            background-color: #222; 
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
            color: #ddd;
        }
        .texto-resaltado {
            color: #00ffcc;
            font-size: 14px;
            margin: 0 0 10px 0;
        }
    </style>
</head>
<body>
    <h1>Catálogo de Ropa</h1>
    
    <!-- Acá es donde tu app.js inyecta los productos -->
    <div id="catalogo"></div>
    
    <hr>

    <h2>Tu Carrito</h2>
    <ul id="carrito"></ul>

    <!-- 3. SECCIÓN DE CHECKOUT CON DATOS BANCARIOS A LA VISTA -->
    <div class="formulario-pago" id="checkout-section">
        <h3>Finalizar Pedido</h3>

        <div class="datos-bancarios">
            <p class="texto-resaltado"><strong>1. Transferí el total a esta cuenta:</strong></p>
            <p style="margin: 5px 0;"><strong>Alias:</strong> lux.indument.mp</p>
            <p style="margin: 5px 0;"><strong>CVU:</strong> 0000003100000000000000</p>
            <p style="margin: 5px 0;"><strong>Titular:</strong> Tu Nombre Apellido</p>
        </div>

        <p class="texto-resaltado"><strong>2. Completá los datos para verificar tu pago:</strong></p>
        
        <label for="input-titular">¿Desde qué cuenta nos transferís?</label>
        <input type="text" id="input-titular" placeholder="Nombre exacto del titular">

        <label for="input-wsp">Tu WhatsApp (opcional pero recomendado):</label>
        <input type="tel" id="input-wsp" placeholder="Ej: 342154279070">

        <label for="input-monto">Monto total a pagar:</label>
        <input type="text" id="input-monto" value="$0" readonly>
        
        <button id="btn-whatsapp" style="margin-top: 20px; width: 100%; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; background-color: #25D366; color: white; border: none; border-radius: 5px;">
            Confirmar y Avisar por WhatsApp
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
