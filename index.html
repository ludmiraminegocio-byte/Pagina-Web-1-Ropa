<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Tienda de Ropa - Lux Indument</title>
    
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .formulario-pago {
            background-color: #111;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            max-width: 400px;
            border: 1px solid #333;
        }
        .formulario-pago label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .formulario-pago input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid #444;
        }
        #input-monto {
            background-color: #222;
            color: #00ffcc;
            font-weight: bold;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Catálogo de Ropa</h1>
    
    <div id="catalogo"></div>
    
    <hr>

    <h2>Tu Carrito</h2>
    <ul id="carrito"></ul>

    <!-- NUEVO FORMULARIO DE PAGO -->
    <div class="formulario-pago">
        <h3>Datos para la Transferencia</h3>
        
        <label for="input-titular">Nombre de la cuenta con la que vas a transferir:</label>
        <input type="text" id="input-titular" placeholder="Ej: Juan Perez">

        <label for="input-monto">Monto total a pagar:</label>
        <input type="text" id="input-monto" value="$0" readonly>
    </div>
    
    <button id="btn-whatsapp" style="padding: 10px 20px; font-size: 16px; cursor: pointer; background-color: #25D366; color: white; border: none; border-radius: 5px;">
        Comprar por WhatsApp
    </button>

    <script src="app.js"></script>
</body>
</html>
